name: Statistical and partition tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]'
      - run: pytest -q tests/test_cv_auc_ci.py tests/test_complete_classification_metrics.py tests/test_fixed_folds.py tests/test_paired_metrics.py tests/test_training_metrics.py
